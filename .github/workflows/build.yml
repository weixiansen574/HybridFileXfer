name: 'Build'

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
  merge_group:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
        with:
          repository: '${{ github.repository }}'
          ref: '${{ github.ref }}'
          submodules: 'recursive'
          fetch-depth: 0

      - name: 'Setup Java'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: 'Setup Gradle'
        uses: gradle/actions/setup-gradle@v4
      - name: 'Setup Android SDK'
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'tools platform-tools cmake;3.10.2.4988404'

      - name: 'Build with Gradle'
        working-directory: 'HybridFileXfer-Android'
        run: |
          sudo chmod -R -- 0755 .
          sudo "$(command -v bash || command -v sh)" -- ./gradlew build

      - name: 'Upload release apk'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v4
        with:
          name: 'release-apk'
          path: '**/build/outputs/apk/release'
          compression-level: 9
          include-hidden-files: true
      - name: 'Upload debug apk'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v4
        with:
          name: 'debug-apk'
          path: '**/build/outputs/apk/debug'
          compression-level: 9
          include-hidden-files: true
      - name: 'Upload mapping files'
        if: '${{ success() }}'
        uses: actions/upload-artifact@v4
        with:
          name: 'mappings'
          path: '**/build/outputs/mapping'
          compression-level: 9
          include-hidden-files: true
