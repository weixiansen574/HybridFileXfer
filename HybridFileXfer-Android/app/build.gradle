plugins {
    id 'com.android.application'
}

android {
    namespace 'top.weixiansen574.hybridfilexfer'
    compileSdk 34

    defaultConfig {
        //applicationId "com.antutu.ABenchMark" //改成此包名提升传输速度😆
        applicationId "top.weixiansen574.hybridfilexfer"
        minSdk 24
        targetSdk 34
        versionCode 310
        versionName "3.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"// 指定目标 CPU 架构
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt" // 指定 CMakeLists.txt 位置
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
        aidl = true
    }

    /*
     * 发布签名。3.1 起改用随机生成的证书，不再复用 debug key。
     *
     * 证书来源优先级：
     *   1. 环境变量 HFX_KEYSTORE（CI 里从 Secret 解码后指定）
     *   2. ~/.android/hfx-release.jks（本地构建的默认位置）
     * 密码通过 HFX_KEYSTORE_PASSWORD 传入，别名默认 hybridfilexfer。
     * 两者都缺失时退化为未签名构建，保证源码在没有证书的机器上仍可编译。
     */
    def hfxKeystore = System.getenv("HFX_KEYSTORE")
    if (!hfxKeystore) {
        def fallback = new File(System.getProperty("user.home"), ".android/hfx-release.jks")
        if (fallback.exists()) {
            hfxKeystore = fallback.absolutePath
        }
    }
    def hfxStorePass = System.getenv("HFX_KEYSTORE_PASSWORD")
    def hfxKeyAlias = System.getenv("HFX_KEY_ALIAS") ?: "hybridfilexfer"
    def hfxKeyPass = System.getenv("HFX_KEY_PASSWORD") ?: hfxStorePass
    def hfxSigningReady = hfxKeystore != null && hfxStorePass != null
            && new File(hfxKeystore.toString()).exists()

    signingConfigs {
        if (hfxSigningReady) {
            release {
                storeFile file(hfxKeystore)
                storePassword hfxStorePass
                keyAlias hfxKeyAlias
                keyPassword hfxKeyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hfxSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    /*implementation 'androidx.appcompat:appcompat:1.7.0'*/
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "io.github.l4digital:fastscroll:2.1.0"
}