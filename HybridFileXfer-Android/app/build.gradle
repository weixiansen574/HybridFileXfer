plugins {
    id 'com.android.application'
}

android {
    namespace 'top.weixiansen574.hybridfilexfer'
    compileSdk 34

    defaultConfig {
        //applicationId "com.antutu.ABenchMark" //改成此包名提升传输速度😆
        applicationId "top.weixiansen574.hybridfilexfer"
        minSdk 24
        targetSdk 34
        versionCode 401
        versionName "4.0.1-preview"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"// 指定目标 CPU 架构
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt" // 指定 CMakeLists.txt 位置
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
        aidl = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Keep APK notices synchronized with the source distribution instead of storing
// duplicate license files under src/main/assets.
def repositoryDirectory = rootProject.projectDir.parentFile
def licenseFiles = [
        new File(repositoryDirectory, 'LICENSE.txt'),
        new File(repositoryDirectory, 'CHANGES.md'),
        new File(repositoryDirectory, 'THIRD_PARTY_NOTICES.txt'),
        new File(repositoryDirectory, 'licenses/FlatLaf-LICENSE.txt'),
        new File(repositoryDirectory, 'licenses/libsu-LICENSE.txt')
]
def generatedLicenseAssets = layout.buildDirectory.dir('generated/licenseAssets')
def generateLicenseAssets = tasks.register('generateLicenseAssets', Sync) {
    from(licenseFiles) {
        into 'licenses'
        rename { name -> name == 'LICENSE.txt' ? 'LICENSE-GPL-3.0.txt' : name }
    }
    into generatedLicenseAssets
    doFirst {
        licenseFiles.each { licenseFile ->
            if (!licenseFile.isFile()) {
                throw new GradleException("Required distribution notice is missing: ${licenseFile}")
            }
        }
    }
}
android.sourceSets.main.assets.srcDir(generatedLicenseAssets)
tasks.named('preBuild').configure {
    dependsOn(generateLicenseAssets)
}

dependencies {
    implementation "com.github.topjohnwu.libsu:core:6.0.0"
    implementation "com.github.topjohnwu.libsu:service:6.0.0"
    /*implementation 'androidx.appcompat:appcompat:1.7.0'*/
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "io.github.l4digital:fastscroll:2.1.0"
}
